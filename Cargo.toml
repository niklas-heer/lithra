[package]
name = "lithra"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Reproducible systems and images, described in a language you can read"
license = "MIT"
repository = "https://github.com/niklas-heer/lithra"
publish = false

[dependencies]

[profile.release]
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
as_conversions = "deny"
